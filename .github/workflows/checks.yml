# The app's checks from a clean install, on every pull request and every push to main: the standard,
# the markets and services at their pins (standard.sh, with services' verifier, host and index
# readied to run), then the type-check, the tests (Vitest), the build, and the browser test in
# Chromium (Playwright). A test that does not run fails its run.

name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          ./standard.sh services
          npx playwright install --with-deps chromium
      - name: Type-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser test
        run: npm run test:browser
