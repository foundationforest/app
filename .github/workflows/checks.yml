# The app's checks from a clean install, on every pull request and every push to main, and in each
# run of markets.yml, against the commit that moves MARKETS and SERVICES: the standard, the markets
# and services at their pins (standard.sh, with services' verifier, host, index and mcp readied to
# run), then the type-check, the tests (Vitest), the build, and the browser test in Chromium
# (Playwright). A test that does not run fails its run.
#
# In Playwright's own image, at the version package.json pins (build.test.ts holds them equal): its
# Chromium and every system package it needs come installed, so no run waits on Ubuntu's package
# servers, which once failed every install for over half an hour. --ipc=host, as Playwright asks of
# Docker, so Chromium has the shared memory it needs.

name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to check, the one that moves MARKETS and SERVICES; empty on a pull request or a push
        type: string
        default: ''

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install
        run: |
          npm ci --no-audit --no-fund
          ./standard.sh services
      - name: Type-check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Browser test
        run: npm run test:browser
